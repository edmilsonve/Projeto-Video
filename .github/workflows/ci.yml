name: ci

on:
  push:
  pull_request:

# Menor privilégio: o CI só lê o código. Nenhum secret é usado aqui.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Varredura de segredos
        run: python scripts/check_secrets.py
      - name: Documentação do workflow em dia
        run: python scripts/gen_workflow_docs.py --check
      - name: Testes (sem rede)
        run: python -m pytest -q
